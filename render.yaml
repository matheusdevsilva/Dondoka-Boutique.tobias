databases:
  - name: dondoka-db
    databaseName: dondoka
    user: dondoka
    plan: free

services:
  - type: web
    name: dondoka-api
    runtime: node
    rootDir: api
    plan: free
    buildCommand: npm install --include=dev && npm run build
    # Free não aceita preDeployCommand — setup do banco no start
    startCommand: npm run postdeploy && npm start
    healthCheckPath: /api/
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dondoka-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SHIPPING_FEE
        value: "15"
      - key: CORS_ORIGIN
        value: https://dondoka-web.onrender.com
      - key: FRONTEND_URL
        value: https://dondoka-web.onrender.com

  - type: web
    name: dondoka-web
    runtime: static
    rootDir: dondoka
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://dondoka-api.onrender.com/api
      - key: VITE_WHATSAPP
        value: "5511949316452"
      - key: VITE_INSTAGRAM
        value: https://www.instagram.com/dondokaboutique.tobias/
