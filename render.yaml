databases:
  - name: dondoka-db
    databaseName: dondoka
    user: dondoka
    # Se o free não estiver disponível na sua conta, use basic-256mb
    plan: basic-256mb

services:
  - type: web
    name: dondoka-api
    runtime: node
    rootDir: api
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    # free tier não aceita preDeployCommand — setup roda no start
    startCommand: npm run postdeploy && npm start
    healthCheckPath: /api/
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dondoka-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SHIPPING_FEE
        value: "15"
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: dondoka-web
    runtime: static
    rootDir: dondoka
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_WHATSAPP
        value: "5511949316452"
      - key: VITE_INSTAGRAM
        value: https://www.instagram.com/dondokaboutique.tobias/
